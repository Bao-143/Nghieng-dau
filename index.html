<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nghiêng đầu chọn đáp án</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
<style>
:root{--bg:#f4f5fb;--card:#fff;--fg:#1c2033;--mut:#667085;--line:#e1e4ef;--acc:#6d5efc;--ok:#16a34a;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--fg:#eceefa;--mut:#9aa1bd;--line:#2a2f4a;--acc:#8b80ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--fg:#eceefa;--mut:#9aa1bd;--line:#2a2f4a;--acc:#8b80ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{background:var(--card);border:1px solid var(--line)}
.mut{color:var(--mut)}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:.6rem;padding:.45rem .7rem;color:var(--fg);width:100%}
.btn{background:var(--acc);color:#fff;border-radius:.7rem;padding:.5rem 1rem;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn-s{border:1px solid var(--line);border-radius:.5rem;padding:.2rem .6rem;font-size:.8rem}
.btn-s:hover{border-color:var(--acc)}
.tab{padding:.45rem 1rem;border-radius:.7rem;font-weight:600;border:1px solid var(--line)}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ans{border:3px solid var(--line);border-radius:1rem;padding:1rem;text-align:center;background:var(--bg);cursor:pointer;position:relative;overflow:hidden;transition:transform .15s}
.ans:hover{transform:translateY(-2px)}
.ans.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
.ans.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.pbar{position:absolute;left:0;bottom:0;height:8px;background:var(--acc);width:0}
input[type=range]{width:100%;accent-color:var(--acc)}
</style>
</head>
<body>
<div class="max-w-6xl mx-auto p-4 grid gap-4 lg:grid-cols-[1fr_330px]">
  <main>
    <header class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <h1 class="text-2xl font-extrabold flex items-center gap-2">
        <span>🙃 Nghiêng đầu chọn đáp án</span>
      </h1>
      <div class="flex items-center gap-2">
        <button id="bMute" class="btn-s flex items-center gap-1">🎵 <span id="mTxt">Tắt nhạc</span></button>
        <nav class="flex gap-2">
          <button id="tPlay" class="tab on">Chơi</button>
          <button id="tEdit" class="tab">Soạn câu hỏi</button>
        </nav>
      </div>
    </header>
    <div id="view"></div>
  </main>

  <aside class="space-y-4">
    <section class="card rounded-2xl p-4">
      <div class="flex items-center justify-between mb-2"><b>Webcam AI</b><button id="bCam" class="btn-s">Bật webcam</button></div>
      <div class="relative rounded-xl overflow-hidden" style="background:#000;aspect-ratio:4/3">
        <canvas id="cv" width="320" height="240" class="w-full h-full"></canvas>
        <video id="vid" playsinline autoplay muted class="hidden"></video>
      </div>
      <div class="relative h-5 rounded-full mt-3 overflow-hidden" style="background:var(--bg);border:1px solid var(--line)">
        <div id="zL" class="absolute top-0 bottom-0 left-0" style="background:color-mix(in srgb,var(--acc) 25%,transparent)"></div>
        <div id="zR" class="absolute top-0 bottom-0 right-0" style="background:color-mix(in srgb,var(--acc) 25%,transparent)"></div>
        <div id="mk" class="absolute top-0 bottom-0 w-1.5 rounded" style="left:50%;background:var(--acc)"></div>
      </div>
      <div class="flex justify-between text-xs mut mt-1"><span>◀ Trái</span><span id="angTxt">Góc: 0°</span><span>Phải ▶</span></div>
      <p id="camMsg" class="text-sm mut mt-2 font-medium">Bấm “Bật webcam” để bắt đầu, hoặc chơi bằng phím ← → / bấm đáp án.</p>
      <button id="bCal" class="btn w-full mt-2">Đặt lại vị trí giữa (0°)</button>
      <p class="text-xs mut mt-2">Ngồi thẳng nhìn vào camera rồi bấm nút để cân góc nếu đang ngồi nghiêng.</p>
    </section>

    <section class="card rounded-2xl p-4 space-y-3 text-sm">
      <b>Cài đặt</b>
      <label class="block">Thời gian mỗi câu: <b id="o_time"></b>s<input type="range" data-s="time" min="5" max="60" step="1"></label>
      <label class="block">Độ nghiêng nhận diện: <b id="o_thr"></b>°<input type="range" data-s="thr" min="6" max="35" step="1"></label>
      <label class="block">Giữ nghiêng để chọn: <b id="o_hold"></b>s<input type="range" data-s="hold" min="0.3" max="2" step="0.1"></label>
      <label class="flex items-center gap-2"><input type="checkbox" data-s="inv"> Đảo chiều trái/phải</label>
    </section>
  </aside>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- HỆ THỐNG ÂM THANH & NHẠC NỀN (WEB AUDIO API) ---------- */
let actx = null;
let bgmGain = null;
let bgmTimer = null;
let bgmStep = 0;
let isMuted = false;

function initAudio() {
  if (!actx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    actx = new AudioContext();
    bgmGain = actx.createGain();
    bgmGain.gain.value = 0.08; // Âm lượng nhạc nền vừa phải, êm dịu
    bgmGain.connect(actx.destination);
  }
  if (actx.state === 'suspended') {
    actx.resume();
  }
}

// Bảng nốt nhạc BGM: Nhẹ nhàng, vui tươi (Âm điệu C Major pentatonic)
const BGM_NOTES = [
  261.63, 329.63, 392.00, 523.25, 392.00, 329.63,
  293.66, 349.23, 440.00, 587.33, 440.00, 349.23,
  329.63, 392.00, 523.25, 659.25, 523.25, 392.00,
  349.23, 440.00, 523.25, 392.00, 329.63, 293.66
];

function playBGMNote() {
  if (isMuted || !actx) return;
  const now = actx.currentTime;
  const osc = actx.createOscillator();
  const noteGain = actx.createGain();
  
  osc.type = 'triangle'; // Âm sắc ấm áp, nhẹ nhàng kiểu marimba/music box
  osc.frequency.setValueAtTime(BGM_NOTES[bgmStep % BGM_NOTES.length], now);
  
  noteGain.gain.setValueAtTime(0, now);
  noteGain.gain.linearRampToValueAtTime(0.5, now + 0.03);
  noteGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

  osc.connect(noteGain);
  noteGain.connect(bgmGain);

  osc.start(now);
  osc.stop(now + 0.4);

  bgmStep++;
}

function startBGM() {
  initAudio();
  if (!bgmTimer) {
    bgmTimer = setInterval(playBGMNote, 240); // Nhịp điệu thong thả (~125 bpm)
  }
}

function stopBGM() {
  if (bgmTimer) {
    clearInterval(bgmTimer);
    bgmTimer = null;
  }
}

$('bMute').onclick = () => {
  initAudio();
  isMuted = !isMuted;
  $('mTxt').textContent = isMuted ? 'Bật nhạc' : 'Tắt nhạc';
  if (isMuted) stopBGM(); else startBGM();
};

// Hiệu ứng âm thanh (Sound Effects)
const sfx = {
  click: () => {
    if (isMuted) return;
    initAudio();
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, actx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, actx.currentTime + 0.08);
    g.gain.setValueAtTime(0.12, actx.currentTime);
    g.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.08);
    osc.connect(g); g.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + 0.08);
  },
  correct: () => {
    if (isMuted) return;
    initAudio();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 (Hợp âm vui chiến thắng)
    notes.forEach((freq, idx) => {
      const t = actx.currentTime + idx * 0.08;
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.2, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + 0.36);
    });
  },
  wrong: () => {
    if (isMuted) return;
    initAudio();
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, actx.currentTime);
    osc.frequency.linearRampToValueAtTime(130, actx.currentTime + 0.3);
    g.gain.setValueAtTime(0.2, actx.currentTime);
    g.gain.linearRampToValueAtTime(0.01, actx.currentTime + 0.3);
    osc.connect(g); g.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + 0.3);
  },
  timeout: () => {
    if (isMuted) return;
    initAudio();
    [350, 300, 250].forEach((freq, idx) => {
      const t = actx.currentTime + idx * 0.12;
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.25, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.14);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + 0.15);
    });
  },
  fanfare: () => {
    if (isMuted) return;
    initAudio();
    const chord = [392.00, 523.25, 659.25, 783.99, 1046.50];
    chord.forEach((freq, i) => {
      const t = actx.currentTime + i * 0.1;
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.25, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + 0.65);
    });
  }
};

/* Tự kích hoạt Audio Context ngay khi click lần đầu trên trang */
window.addEventListener('click', () => {
  if (!actx) startBGM();
}, { once: true });

/* ---------- DỮ LIỆU & LƯU TRỮ ---------- */
const DEF_Q=[
 {q:'Thủ đô của Việt Nam là thành phố nào?',qImg:'',a:[{t:'Hà Nội',img:''},{t:'Đà Nẵng',img:''}],correct:0,time:null},
 {q:'Một tuần có bao nhiêu ngày?',qImg:'',a:[{t:'6 ngày',img:''},{t:'7 ngày',img:''}],correct:1,time:null},
 {q:'Mặt trời mọc ở hướng nào?',qImg:'',a:[{t:'Hướng Đông',img:''},{t:'Hướng Tây',img:''}],correct:0,time:10}
];
const DEF_S={time:15,thr:14,hold:0.8,inv:false};
let Q=load('tiltquiz:q',DEF_Q), S={...DEF_S,...load('tiltquiz:s',{})};
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):JSON.parse(JSON.stringify(d))}catch(e){return JSON.parse(JSON.stringify(d))}}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('tiltquiz:q',JSON.stringify(Q));localStorage.setItem('tiltquiz:s',JSON.stringify(S))}catch(e){toast('Bộ nhớ đầy, hãy dùng ảnh nhẹ hơn.')}},300)}
function toast(t){$('camMsg').innerHTML=t}

/* ---------- CÀI ĐẶT ---------- */
document.querySelectorAll('[data-s]').forEach(el=>{
  const k=el.dataset.s;
  if(el.type==='checkbox'){el.checked=S[k];el.onchange=()=>{S[k]=el.checked;save()}}
  else{el.value=S[k];$('o_'+k).textContent=S[k];el.oninput=()=>{S[k]=+el.value;$('o_'+k).textContent=S[k];save();drawZones()}}
});
function drawZones(){const w=S.thr/45*50;$('zL').style.width=(50-w)+'\%';$('zR').style.width=(50-w)+'%'}
drawZones();

/* ---------- MEDIAPIPE FACE MESH ---------- */
const vid=$('vid'), cv=$('cv'), cx2=cv.getContext('2d');
const cam={
  on: false,
  stream: null,
  rawAngle: 0,
  baseAngle: 0,
  tilt: 0,
  found: false,
  landmarks: null,
  processing: false
};

let faceMesh = null;

function initFaceMesh() {
  const MP_VER = '0.4.1633559619';
  faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@${MP_VER}/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  faceMesh.onResults(onFaceResults);
}

function onFaceResults(results) {
  cam.processing = false;
  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    cam.found = true;
    cam.landmarks = results.multiFaceLandmarks[0];

    const pRightEye = cam.landmarks[33];
    const pLeftEye = cam.landmarks[263];

    const dx = pLeftEye.x - pRightEye.x;
    const dy = pLeftEye.y - pRightEye.y;

    const angle = Math.atan2(dy, dx) * (180 / Math.PI);
    cam.rawAngle = cam.rawAngle * 0.7 + angle * 0.3;
    cam.tilt = cam.rawAngle - cam.baseAngle;
  } else {
    cam.found = false;
    cam.landmarks = null;
  }
}

$('bCam').onclick = async () => {
  sfx.click();
  if (cam.on) {
    if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
    vid.srcObject = null;
    cam.on = false;
    cam.found = false;
    $('bCam').textContent = 'Bật webcam';
    toast('Đã tắt webcam.');
    return;
  }

  try {
    toast('⏳ Đang khởi tạo mô hình AI...');
    if (!faceMesh) {
      if (typeof FaceMesh === 'undefined') {
        throw new Error('Chưa tải được script FaceMesh từ CDN.');
      }
      initFaceMesh();
    }

    toast('⏳ Đang yêu cầu quyền camera...');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
      audio: false
    });

    vid.srcObject = stream;
    cam.stream = stream;
    await vid.play();

    cam.on = true;
    $('bCam').textContent = 'Tắt webcam';
    toast('✅ Đã bật webcam! Ngồi thẳng và nghiêng đầu để chơi.');
  } catch (err) {
    console.error(err);
    toast('<span class="text-red-500">❌ Không bật được camera: ' + (err.message || err.name) + '</span>');
  }
};

$('bCal').onclick = () => {
  sfx.click();
  if (!cam.on || !cam.found) {
    toast('Cần bật webcam và nhìn vào khung hình để cân giữa.');
    return;
  }
  cam.baseAngle = cam.rawAngle;
  toast('Đã cân giữa thành công (0°)!');
};

function camDir() {
  if (!cam.on || !cam.found) return null;
  let t = S.inv ? -cam.tilt : cam.tilt;
  return t < -S.thr ? 'L' : t > S.thr ? 'R' : null;
}

function processFrame() {
  if (cam.on && vid.readyState >= 2 && faceMesh && !cam.processing) {
    cam.processing = true;
    faceMesh.send({ image: vid }).catch(err => {
      console.warn('Lỗi xử lý frame:', err);
      cam.processing = false;
    });
  }
}

function drawCam() {
  cx2.clearRect(0, 0, 320, 240);

  if (cam.on && vid.readyState >= 2) {
    cx2.save();
    cx2.translate(320, 0);
    cx2.scale(-1, 1);
    cx2.drawImage(vid, 0, 0, 320, 240);

    if (cam.found && cam.landmarks) {
      const p1 = cam.landmarks[33];
      const p2 = cam.landmarks[263];
      const nose = cam.landmarks[1];

      cx2.fillStyle = '#22c55e';
      cx2.beginPath();
      cx2.arc(p1.x * 320, p1.y * 240, 4, 0, 2 * Math.PI);
      cx2.arc(p2.x * 320, p2.y * 240, 4, 0, 2 * Math.PI);
      cx2.arc(nose.x * 320, nose.y * 240, 4, 0, 2 * Math.PI);
      cx2.fill();

      cx2.strokeStyle = '#22c55e';
      cx2.lineWidth = 2;
      cx2.beginPath();
      cx2.moveTo(p1.x * 320, p1.y * 240);
      cx2.lineTo(p2.x * 320, p2.y * 240);
      cx2.stroke();
    }
    cx2.restore();
  } else {
    cx2.fillStyle = '#111';
    cx2.fillRect(0, 0, 320, 240);
  }

  const t = cam.on && cam.found ? (S.inv ? -cam.tilt : cam.tilt) : 0;
  $('mk').style.left = (50 + clamp(t, -45, 45) / 45 * 50 - 0.8) + '\%';$('angTxt').textContent = (cam.on && cam.found) ? ('Góc: ' + (t > 0 ? '+' : '') + t.toFixed(0) + '°') : 'Góc: –';
}

/* ---------- TRÒ CHƠI ---------- */
let G={state:'idle'}, keyDir=null;
const view=$('view');
function setTab(t){
  sfx.click();
  $('tPlay').classList.toggle('on',t==='play');$('tEdit').classList.toggle('on',t==='edit');
  if(t==='play'){renderStart()}else{G={state:'idle'};renderEditor()}
}
$('tPlay').onclick=()=>setTab('play');$('tEdit').onclick=()=>setTab('edit');

function renderStart(){
  G={state:'idle'};
  view.innerHTML=`<div class="card rounded-2xl p-6 text-center">
    <h2 class="text-xl font-bold">Sẵn sàng chưa? 🎧</h2>
    <p class="mut mt-2">${Q.length} câu hỏi · mặc định ${S.time}s/câu. Nghiêng đầu sang <b>trái</b> hoặc <b>phải</b> và giữ ${S.hold}s để chọn đáp án.</p>
    <p class="mut text-sm mt-1">Không dùng webcam? Giữ phím ← / → hoặc bấm trực tiếp vào đáp án.</p>
    <button id="go" class="btn mt-5 text-lg">▶ Bắt đầu chơi</button></div>`;
  $('go').onclick=()=>{
    startBGM();
    startGame();
  };
}
function startGame(){
  sfx.click();
  if(!Q.length){view.innerHTML='<div class="card rounded-2xl p-6 text-center">Chưa có câu hỏi. Hãy vào “Soạn câu hỏi”.</div>';return}
  G={state:'q',i:0,score:0,log:[]};showQ();
}
function ansHTML(q,k){
  const a=q.a[k];
  return `<div class="ans" id="ans${k}" data-k="${k}"><div class="text-xs mut mb-2">${k?'Nghiêng phải ▶':'◀ Nghiêng trái'}</div>
    ${a.img?`<img src="${a.img}" class="mx-auto max-h-40 rounded-lg mb-2 object-contain">`:''}
    <div class="text-lg font-semibold">${esc(a.t)}</div><div class="pbar" id="p${k}"></div></div>`;
}
function showQ(){
  const q=Q[G.i];
  view.innerHTML=`<div class="card rounded-2xl p-5">
    <div class="flex justify-between text-sm"><span>Câu ${G.i+1}/${Q.length}</span><span>Điểm: <b id="sc">${G.score}</b></span><span id="tl"></span></div>
    <div class="h-2 rounded-full mt-2 overflow-hidden" style="background:var(--line)"><div id="tb" class="h-full" style="background:var(--acc);width:100%"></div></div>
    <h2 class="text-2xl font-bold mt-4">${esc(q.q)}</h2>
    ${q.qImg?`<img src="${q.qImg}" class="mt-3 max-h-64 rounded-xl object-contain">`:''}
    <div class="grid grid-cols-2 gap-3 mt-5">${ansHTML(q,0)}${ansHTML(q,1)}</div>
    <p id="fb" class="text-center font-bold text-lg mt-4 h-7"></p></div>`;
  view.querySelectorAll('.ans').forEach(e=>e.onclick=()=>answer(+e.dataset.k));
  G.state='q';G.t0=performance.now();G.dur=(q.time||S.time)*1000;G.dir=null;G.since=0;
}
function answer(k){
  if(G.state!=='q')return;
  G.state='fb';const q=Q[G.i],ok=k===q.correct;
  if(k<0){
    sfx.timeout();
  } else if(ok){
    sfx.correct();
    G.score++;
  } else {
    sfx.wrong();
  }

  G.log.push({q:q.q,ok,picked:k<0?'(hết giờ)':q.a[k].t,right:q.a[q.correct].t});
  $('ans'+q.correct).classList.add('ok');
  if(k>=0&&!ok)$('ans'+k).classList.add('bad');$('fb').textContent=k<0?'⏰ Hết giờ!':ok?'🎉 Chính xác!':'❌ Chưa đúng rồi';

}
